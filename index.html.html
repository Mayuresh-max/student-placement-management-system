    /** Returns today's local date in YYYY-MM-DD format */
    function getTodayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /** Returns a local date offset by N days in YYYY-MM-DD format */
    function getOffsetDateISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /** Escapes special HTML characters to prevent XSS */
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /** Formats ISO datetime string for display */
    function formatDateTime(dtStr) {
      if (!dtStr) return '—';
      const d = new Date(dtStr);
      if (isNaN(d.getTime())) return dtStr;
      return d.toLocaleString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    let DB = null;

    function initDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          DB = JSON.parse(raw);
          if (DB && Array.isArray(DB.students) && Array.isArray(DB.companies) && Array.isArray(DB.jobs)) {
            return;
          }
        }
      } catch (err) {
        console.warn('Re-seeding localStorage due to parse error:', err);
      }
      DB = buildSeedDatabase();
      saveDB();
    }

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      } catch (err) {
        showToast('Unable to persist data in browser storage.', 'error');
      }
    }

    function nextNumericId(collection, idField, fallbackStart = 1) {
      if (!collection.length) return fallbackStart;
      return Math.max(...collection.map(item => Number(item[idField]) || 0)) + 1;

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          // Validate student still exists if student session
          if (parsed && parsed.role === 'STUDENT') {
            const exists = getStudentById(parsed.id);
            if (!exists || exists.status !== 'ACTIVE') {
              saveSession(null);
              return;
            }
            parsed.name = exists.name;
          }
          state.session = parsed;
        }
      } catch (e) {
        state.session = null;
      }
    }

    function saveSession(sessionObj) {
      state.session = sessionObj;
      try {
        if (sessionObj) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionObj));
        } else {
          sessionStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {
        // Ignore restricted sessionStorage
      }
    }

      return DB.students.find(s => String(s.student_id) === String(id)) || null;

      return DB.jobs.find(j => Number(j.job_id) === Number(id)) || null;

    }

    function getResultForApp(appId) {
      return DB.results.find(r => Number(r.application_id) === Number(appId)) || null;

    /**
     * Evaluates eligibility of a student against a job's criteria.
     * Rules:
     * 1. Student must be ACTIVE
     * 2. Job must be OPEN
     * 3. Job deadline (last_date) >= Today
     * 4. Student CGPA >= Job min_cgpa
     * 5. Student backlogs <= Job max_backlogs
     */
    function checkEligibility(student, job) {
      const reasons = [];
      const today = getTodayISO();

      if (student.status !== 'ACTIVE') {
        reasons.push('Student profile inactive');
      }
      if (job.status !== 'OPEN') {
        reasons.push('Job opening closed');
      }
      if (job.last_date && job.last_date < today) {
        reasons.push(`Deadline passed (${job.last_date})`);
      }
      if (Number(student.cgpa) < Number(job.min_cgpa)) {
        reasons.push(`Requires Min CGPA ${Number(job.min_cgpa).toFixed(2)}`);
      }
      if (Number(student.backlogs) > Number(job.max_backlogs)) {
        reasons.push(`Max ${job.max_backlogs} Backlog${job.max_backlogs === 1 ? '' : 's'} allowed`);
      }

      return {
        eligible: reasons.length === 0,
        reasons
      };
    }

      const map = {

        INACTIVE: 'bg-slate-100 text-slate-600 ring-slate-500/20',
        OPEN: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20',

        APPLIED: 'bg-sky-50 text-sky-700 ring-sky-600/20',
        SHORTLISTED: 'bg-blue-50 text-blue-700 ring-blue-600/20',
        INTERVIEW_SCHEDULED: 'bg-amber-50 text-amber-700 ring-amber-600/20',
        SELECTED: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20',
        REJECTED: 'bg-rose-50 text-rose-700 ring-rose-600/20',
        ON_HOLD: 'bg-slate-100 text-slate-700 ring-slate-500/20'
      };
      const cls = map[status] || 'bg-slate-100 text-slate-700 ring-slate-500/20';
      const label = (status || '').replace(/_/g, ' ');
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1 ring-inset ${cls}">${escapeHTML(label)}</span>`;
    }

    /* =========================================================================
       5. TOAST, MODAL & CONFIRM DIALOG HELPERS
       ========================================================================= */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-blue-600 text-white',
        warning: 'bg-amber-500 text-white'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium animate-fade-in ${colors[type] || colors.info}`;
      el.innerHTML = `
        <span>${escapeHTML(message)}</span>
        <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100 text-white font-bold leading-none">&times;</button>
      `;
      container.appendChild(el);
      setTimeout(() => {
        if (el.parentElement) el.remove();
      }, 3600);
    }

    function openModal(title, bodyHTML) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHTML;
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      document.getElementById('modal-body').innerHTML = '';
    }

    function showConfirm(title, message, onConfirm, confirmLabel = 'Confirm', danger = false) {
      const backdrop = document.getElementById('confirm-backdrop');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      const okBtn = document.getElementById('confirm-ok-btn');
      const cancelBtn = document.getElementById('confirm-cancel-btn');
      okBtn.textContent = confirmLabel;
      okBtn.className = danger
        ? 'px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition'
        : 'px-4 py-2 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 transition';

      const cleanup = () => {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      };
      cancelBtn.onclick = cleanup;
      okBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* =========================================================================

       ========================================================================= */
    function computePlacementKPIs() {
      const totalStudents = DB.students.length;
      const activeStudents = DB.students.filter(s => s.status === 'ACTIVE').length;
      const activeCompanies = DB.companies.filter(c => c.status === 'ACTIVE').length;
      const openJobs = DB.jobs.filter(j => j.status === 'OPEN').length;
      const totalApps = DB.applications.length;

      const selectedResults = DB.results.filter(r => r.result_status === 'SELECTED');
      const placedStudentIds = new Set(
        selectedResults
          .map(r => getApplicationById(r.application_id))
          .filter(Boolean)
          .map(a => String(a.student_id))
      );
      const placedCount = placedStudentIds.size;
      const packages = selectedResults.map(r => Number(r.package_lpa) || 0).filter(p => p > 0);
      const highestLpa = packages.length ? Math.max(...packages) : 0;
      const avgLpa = packages.length ? (packages.reduce((a, b) => a + b, 0) / packages.length) : 0;

      return { totalStudents, activeStudents, activeCompanies, openJobs, totalApps, placedCount, highestLpa, avgLpa };
    }

    function saveStudentForm(event, existingId) {
      event.preventDefault();
      const student_id = existingId ? String(existingId) : document.getElementById('stu-id').value.trim();
      const name = document.getElementById('stu-name').value.trim();
      const phone = document.getElementById('stu-phone').value.trim();
      const course = document.getElementById('stu-course').value;
      const status = document.getElementById('stu-status').value;
      const cgpa = parseFloat(document.getElementById('stu-cgpa').value);
      const backlogs = parseInt(document.getElementById('stu-backlogs').value, 10);

      if (!student_id) {
        showToast('Student ID is required.', 'error');
        return;
      }
      if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {
        showToast('CGPA must be between 0.00 and 10.00.', 'error');
        return;
      }
      if (isNaN(backlogs) || backlogs < 0) {
        showToast('Backlogs must be 0 or greater.', 'error');
        return;
      }

      if (!existingId && DB.students.some(s => String(s.student_id).toLowerCase() === student_id.toLowerCase())) {
        showToast('A student with this Student ID already exists.', 'error');
        return;
      }

      if (existingId) {
        const s = getStudentById(existingId);
        Object.assign(s, { name, phone, course, cgpa, backlogs, status });
        showToast(`Student ${name} updated successfully.`, 'success');
      } else {
        DB.students.push({ student_id, name, phone, course, cgpa, backlogs, status });
        showToast(`Student ${name} added successfully.`, 'success');
      }
      saveDB();
      closeModal();
      render();
    }

    function toggleStudentStatus(studentId) {
      const s = getStudentById(studentId);
      if (!s) return;
      const nextStatus = s.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
      showConfirm(
        `${nextStatus === 'INACTIVE' ? 'Deactivate' : 'Activate'} Student?`,
        `Set ${s.name} (ID: ${s.student_id}) to ${nextStatus}?`,
        () => {
          s.status = nextStatus;
          saveDB();
          showToast(`Student marked as ${nextStatus}.`, 'info');
          render();
        },
        nextStatus === 'INACTIVE' ? 'Deactivate' : 'Activate',
        nextStatus === 'INACTIVE'
      );
    }

              <select id="job-status" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:border-blue-500 outline-none">
                <option value="OPEN" ${(j?.status || 'OPEN') === 'OPEN' ? 'selected' : ''}>OPEN</option>
                <option value="CLOSED" ${j?.status === 'CLOSED' ? 'selected' : ''}>CLOSED</option>
              </select>

    function saveJobForm(event, jobId) {
      event.preventDefault();
      const company_id = Number(document.getElementById('job-company').value);
      const title = document.getElementById('job-title').value.trim();
      const description = document.getElementById('job-desc').value.trim();
      const min_cgpa = parseFloat(document.getElementById('job-cgpa').value);
      const max_backlogs = parseInt(document.getElementById('job-backlogs').value, 10);
      const last_date = document.getElementById('job-date').value;
      const status = document.getElementById('job-status').value;

      if (isNaN(min_cgpa) || min_cgpa < 0 || min_cgpa > 10) {
        showToast('Minimum CGPA must be between 0.00 and 10.00.', 'error');
        return;
      }
      if (jobId) {
        const j = getJobById(jobId);
        Object.assign(j, { company_id, title, description, min_cgpa, max_backlogs, last_date, status });
        showToast('Job opening updated.', 'success');
      } else {
        DB.jobs.push({
          job_id: nextNumericId(DB.jobs, 'job_id', 301),
          company_id, title, description, min_cgpa, max_backlogs, last_date, status
        });
        showToast('Job opening published!', 'success');
      }
      saveDB();
      closeModal();
      render();
    }

    function toggleJobStatus(jobId) {
      const j = getJobById(jobId);
      if (!j) return;
      j.status = j.status === 'OPEN' ? 'CLOSED' : 'OPEN';
      saveDB();
      showToast(`Job "${j.title}" is now ${j.status}.`, 'info');
      render();
    }

            <select onchange="state.appStatusFilter = this.value; render();"

          <div class="space-y-3">

                  <div class="flex flex-wrap items-start justify-between gap-3">

                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-xs font-mono text-slate-400">APP #${app.application_id}</span>
                        <h3 class="text-base font-bold text-slate-900">${escapeHTML(stu?.name || 'Unknown')}</h3>
                        ${statusBadge(app.status)}
                      </div>
                      <p class="text-xs text-slate-500 mt-1">
                        ID: ${escapeHTML(stu?.student_id || '-')} • ${escapeHTML(stu?.course || '-')} • CGPA ${stu ? Number(stu.cgpa).toFixed(2) : '-'} • Backlogs: ${stu?.backlogs ?? '-'} • Applied: ${escapeHTML(app.applied_on)}
                      </p>
                      <p class="text-sm font-semibold text-blue-700 mt-1.5">
                        ${escapeHTML(job?.title || 'Unknown Job')} <span class="font-normal text-slate-500">at ${escapeHTML(comp?.company_name || '')}</span>
                      </p>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                      <select onchange="updateApplicationStatus(${app.application_id}, this.value)"

                        ${['APPLIED', 'SHORTLISTED', 'INTERVIEW_SCHEDULED', 'SELECTED', 'REJECTED'].map(st =>

                      <button onclick="openResultModal(${app.application_id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 transition">

                        ${res ? `
                          <div class="flex items-center gap-2 mt-1">
                            ${statusBadge(res.result_status)}
                            ${res.result_status === 'SELECTED' && Number(res.package_lpa) > 0
                              ? `<span class="font-bold text-emerald-700 text-sm">${Number(res.package_lpa).toFixed(2)} LPA</span>`

        </div>
      `;

    function updateApplicationStatus(appId, newStatus) {
      const app = getApplicationById(appId);
      if (!app) return;
      app.status = newStatus;
      saveDB();
      showToast(`Application #${appId} updated to ${newStatus.replace(/_/g, ' ')}.`, 'success');
      render();
    }

    function openInterviewModal(appId) {
      const app = getApplicationById(appId);
      const stu = getStudentById(app.student_id);
      const job = getJobById(app.job_id);
      const existing = getInterviewsForApp(appId);

      openModal(`Schedule Interview — ${stu?.name || ''}`, `
        <div class="space-y-5">
          <div class="text-xs bg-blue-50 text-blue-900 px-3.5 py-2.5 rounded-xl">
            <strong>Job:</strong> ${escapeHTML(job?.title || '')} • <strong>App #${appId}</strong>
          </div>

          <form onsubmit="saveInterviewForm(event, ${appId})" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Round Name *</label>
              <input id="iv-round" type="text" required placeholder="e.g. Aptitude / Technical Round 1 / HR Round"
                class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:border-blue-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Interview Date & Time *</label>
              <input id="iv-date" type="datetime-local" required value="${getOffsetDateISO(2)}T11:00"
                class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:border-blue-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Remarks / Venue</label>
              <textarea id="iv-remarks" rows="2" placeholder="e.g. Placement Cell Seminar Hall"
                class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:border-blue-500 outline-none"></textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200">Close</button>
              <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700">Schedule Round</button>
            </div>
          </form>

          ${existing.length ? `
            <div class="pt-4 border-t border-slate-100">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Scheduled Rounds</div>
              <div class="space-y-2">
                ${existing.map(iv => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/70 text-xs flex justify-between gap-2">
                    <div>
                      <div class="font-bold text-slate-800">${escapeHTML(iv.round_name)}</div>
                      <div class="text-slate-500">${formatDateTime(iv.interview_date)}</div>
                      <div class="text-slate-600 mt-0.5">${escapeHTML(iv.remarks || '')}</div>
                    </div>
                    <button onclick="deleteInterview(${iv.interview_id}, ${appId})" class="text-rose-500 hover:text-rose-700 font-semibold self-start">Remove</button>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `);
    }

    function saveInterviewForm(event, appId) {
      event.preventDefault();
      const round_name = document.getElementById('iv-round').value.trim();
      const interview_date = document.getElementById('iv-date').value;
      const remarks = document.getElementById('iv-remarks').value.trim();

      DB.interviews.push({
        interview_id: nextNumericId(DB.interviews, 'interview_id', 501),
        application_id: appId,
        interview_date,
        round_name,
        remarks
      });
      const app = getApplicationById(appId);
      if (app && (app.status === 'APPLIED' || app.status === 'SHORTLISTED')) {
        app.status = 'INTERVIEW_SCHEDULED';
      }
      saveDB();
      showToast('Interview round scheduled successfully.', 'success');
      closeModal();
      render();
    }

    function deleteInterview(interviewId, appId) {
      DB.interviews = DB.interviews.filter(iv => Number(iv.interview_id) !== Number(interviewId));
      saveDB();
      showToast('Interview round removed.', 'info');
      openInterviewModal(appId);
      render();
    }

    function openResultModal(appId) {
      const app = getApplicationById(appId);
      const stu = getStudentById(app.student_id);
      const job = getJobById(app.job_id);
      const existing = getResultForApp(appId);

      openModal(`Final Result — ${stu?.name || ''}`, `
        <form onsubmit="saveResultForm(event, ${appId})" class="space-y-4">
          <div class="text-xs bg-slate-50 border border-slate-200 px-3.5 py-2.5 rounded-xl text-slate-700">
            <strong>Job:</strong> ${escapeHTML(job?.title || '')} • <strong>App #${appId}</strong>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Result Status *</label>
            <select id="res-status" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:border-blue-500 outline-none">
              <option value="SELECTED" ${(existing?.result_status || 'SELECTED') === 'SELECTED' ? 'selected' : ''}>SELECTED</option>
              <option value="REJECTED" ${existing?.result_status === 'REJECTED' ? 'selected' : ''}>REJECTED</option>
              <option value="ON_HOLD" ${existing?.result_status === 'ON_HOLD' ? 'selected' : ''}>ON HOLD</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Package Offered (LPA)</label>
            <input id="res-package" type="number" step="0.1" min="0" max="100" value="${existing ? existing.package_lpa : '4.5'}" placeholder="e.g. 5.5"
              class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:border-blue-500 outline-none" />
            <p class="text-[11px] text-slate-400 mt-1">Recorded in Lakhs Per Annum (applicable when SELECTED).</p>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200">Cancel</button>
            <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700">Save Final Result</button>
          </div>
        </form>
      `);
    }

    function saveResultForm(event, appId) {
      event.preventDefault();
      const result_status = document.getElementById('res-status').value;
      const package_lpa = result_status === 'SELECTED' ? (parseFloat(document.getElementById('res-package').value) || 0) : 0;

      const existing = getResultForApp(appId);
      if (existing) {
        existing.result_status = result_status;
        existing.package_lpa = package_lpa;
      } else {
        DB.results.push({
          result_id: nextNumericId(DB.results, 'result_id', 601),
          application_id: appId,
          result_status,
          package_lpa
        });
      }

      const app = getApplicationById(appId);
      if (app && (result_status === 'SELECTED' || result_status === 'REJECTED')) {
        app.status = result_status;
      }

      saveDB();
      showToast('Final placement result saved.', 'success');
      closeModal();
      render();
    }

    /* =========================================================================
       13. MODULE 7: ALL 7 PLACEMENT REPORTS (PRINT + CSV EXPORT)
       ========================================================================= */
    const REPORT_TABS = [
      { id: 'students', label: '1. Student Master List' },
      { id: 'companies', label: '2. Company Directory' },
      { id: 'jobs', label: '3. Job Openings' },
      { id: 'eligible', label: '4. Eligible Students/Job' },
      { id: 'job_apps', label: '5. Job-wise Applications' },
      { id: 'interviews', label: '6. Interview Schedule' },
      { id: 'placement', label: '7. Final Placement Report' }
    ];

    function getActiveReportData() {
      const tab = state.activeReport;
      if (tab === 'students') {
        return {
          title: '1. Student Master List',
          filename: 'student_master_list.csv',
          headers: ['Student ID', 'Full Name', 'Phone', 'Course', 'CGPA', 'Backlogs', 'Status'],
          rows: DB.students.map(s => [
            s.student_id, s.name, s.phone || '-', s.course, Number(s.cgpa).toFixed(2), s.backlogs, s.status
          ])
        };
      }
      if (tab === 'companies') {
        return {
          title: '2. Company Directory',
          filename: 'company_directory.csv',
          headers: ['Company ID', 'Company Name', 'Location', 'Contact Person', 'Contact Phone', 'Status', 'Total Jobs'],
          rows: DB.companies.map(c => [
            c.company_id, c.company_name, c.location || '-', c.contact_person || '-', c.contact_phone || '-', c.status,
            DB.jobs.filter(j => Number(j.company_id) === Number(c.company_id)).length
          ])
        };
      }
      if (tab === 'jobs') {
        return {
          title: '3. Job Openings Report',
          filename: 'job_openings_report.csv',
          headers: ['Job ID', 'Company', 'Job Title', 'Min CGPA', 'Max Backlogs', 'Deadline', 'Status', 'Applications'],
          rows: DB.jobs.map(j => [
            j.job_id, getCompanyById(j.company_id)?.company_name || '-', j.title,
            Number(j.min_cgpa).toFixed(2), j.max_backlogs, j.last_date, j.status,
            DB.applications.filter(a => Number(a.job_id) === Number(j.job_id)).length
          ])
        };
      }
      if (tab === 'eligible') {
        if (!state.eligibleReportJobId && DB.jobs.length) {
          state.eligibleReportJobId = DB.jobs[0].job_id;
        }
        const job = getJobById(state.eligibleReportJobId);
        const comp = job ? getCompanyById(job.company_id) : null;
        const eligibleStudents = job
          ? DB.students.filter(s => s.status === 'ACTIVE' && Number(s.cgpa) >= Number(job.min_cgpa) && Number(s.backlogs) <= Number(job.max_backlogs))
          : [];
        return {
          title: job ? `4. Eligible Students for "${job.title}" (${comp?.company_name || ''})` : '4. Eligible Students per Job',
          filename: `eligible_students_job_${job?.job_id || 'none'}.csv`,
          headers: ['Student ID', 'Full Name', 'Phone', 'Course', 'CGPA', 'Backlogs', 'Already Applied?'],
          rows: eligibleStudents.map(s => {
            const applied = DB.applications.some(a => String(a.student_id) === String(s.student_id) && Number(a.job_id) === Number(job.job_id));
            return [s.student_id, s.name, s.phone || '-', s.course, Number(s.cgpa).toFixed(2), s.backlogs, applied ? 'Yes' : 'No'];
          })
        };
      }
      if (tab === 'job_apps') {
        return {
          title: '5. Job-wise Applications & Status Summary',
          filename: 'job_wise_applications.csv',
          headers: ['App ID', 'Job Title', 'Company', 'Student ID', 'Student Name', 'Course', 'CGPA', 'Applied On', 'Status'],
          rows: DB.applications.map(a => {
            const stu = getStudentById(a.student_id);
            const job = getJobById(a.job_id);
            const comp = job ? getCompanyById(job.company_id) : null;
            return [
              a.application_id, job?.title || '-', comp?.company_name || '-',
              stu?.student_id || '-', stu?.name || '-', stu?.course || '-',
              stu ? Number(stu.cgpa).toFixed(2) : '-', a.applied_on, a.status
            ];
          })
        };
      }
      if (tab === 'interviews') {
        return {
          title: '6. Interview Schedule & Round Status',
          filename: 'interview_schedule_report.csv',
          headers: ['Interview ID', 'Date & Time', 'Round Name', 'Student', 'Company', 'Job Title', 'App Status', 'Remarks'],
          rows: DB.interviews.map(iv => {
            const app = getApplicationById(iv.application_id);
            const stu = app ? getStudentById(app.student_id) : null;
            const job = app ? getJobById(app.job_id) : null;
            const comp = job ? getCompanyById(job.company_id) : null;
            return [
              iv.interview_id, formatDateTime(iv.interview_date), iv.round_name,
              stu?.name || '-', comp?.company_name || '-', job?.title || '-',
              app?.status || '-', iv.remarks || '-'
            ];
          })
        };
      }
      // 7. Final Placement Report
      const selected = DB.results.filter(r => r.result_status === 'SELECTED');
      return {
        title: '7. Final Placement Report (Selected Students & Packages)',
        filename: 'final_placement_report.csv',
        headers: ['Student ID', 'Student Name', 'Course', 'CGPA', 'Company', 'Job Role', 'Package (LPA)'],
        rows: selected.map(r => {
          const app = getApplicationById(r.application_id);
          const stu = app ? getStudentById(app.student_id) : null;
          const job = app ? getJobById(app.job_id) : null;
          const comp = job ? getCompanyById(job.company_id) : null;
          return [
            stu?.student_id || '-', stu?.name || '-', stu?.course || '-',
            stu ? Number(stu.cgpa).toFixed(2) : '-', comp?.company_name || '-',
            job?.title || '-', Number(r.package_lpa).toFixed(2)
          ];
        })
      };
    }

      const kpi = computePlacementKPIs();

      const jobSummaryHTML = state.activeReport === 'job_apps' ? `
        <div class="mb-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                <div class="text-slate-500 truncate">${escapeHTML(comp?.company_name || '')}</div>
                <div class="mt-2 flex items-center justify-between font-semibold">
                  <span class="text-blue-700">Total: ${apps.length}</span>
                  <span class="text-amber-700">In Process: ${shortlisted}</span>
                  <span class="text-emerald-700">Selected: ${selected}</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : '';

      const placementSummaryHTML = state.activeReport === 'placement' ? `
        <div class="mb-5 grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
            <div class="text-xs font-semibold text-emerald-700 uppercase">Total Placed Students</div>
            <div class="text-2xl font-extrabold text-emerald-900 mt-1">${kpi.placedCount}</div>
          </div>

    function exportActiveReportCSV() {
      const report = getActiveReportData();
      const csvEscape = val => {
        const str = String(val ?? '');
        if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
        return str;
      };
      const lines = [
        report.headers.map(csvEscape).join(','),
        ...report.rows.map(row => row.map(csvEscape).join(','))
      ];
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = report.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Exported ${report.filename}`, 'success');
    }

    function handleStudentApply(jobId) {

      const duplicate = DB.applications.find(
        a => String(a.student_id) === String(student.student_id) && Number(a.job_id) === Number(job.job_id)
      );
      if (duplicate) {
        showToast('You have already applied for this job opening.', 'warning');
        return;
      }

      const elig = checkEligibility(student, job);
      if (!elig.eligible) {
        showToast(`Not eligible: ${elig.reasons.join(', ')}`, 'error');
        return;
      }

      showConfirm(
        'Submit Job Application?',
        `Confirm application for "${job.title}" at ${getCompanyById(job.company_id)?.company_name || ''} using your current academic profile (CGPA ${Number(student.cgpa).toFixed(2)}, ${student.backlogs} backlogs).`,
        () => {
          DB.applications.push({
            application_id: nextNumericId(DB.applications, 'application_id', 401),
            student_id: student.student_id,
            job_id: job.job_id,
            applied_on: getTodayISO(),
            status: 'APPLIED'
          });
          saveDB();
          showToast(`Successfully applied to ${job.title}!`, 'success');
          render();
        },
        'Submit Application'
      );
    }

    function saveStudentOwnProfile(event) {
      event.preventDefault();
      const student = getStudentById(state.session.id);
      if (!student) return;

      const name = document.getElementById('prof-name').value.trim();
      const phone = document.getElementById('prof-phone').value.trim();
      const course = document.getElementById('prof-course').value;
      const cgpa = parseFloat(document.getElementById('prof-cgpa').value);
      const backlogs = parseInt(document.getElementById('prof-backlogs').value, 10);

      if (!name) {
        showToast('Full name is required.', 'error');
        return;
      }
      if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {
        showToast('CGPA must be between 0.00 and 10.00.', 'error');
        return;
      }
      if (isNaN(backlogs) || backlogs < 0) {
        showToast('Backlogs must be 0 or greater.', 'error');
        return;
      }

      Object.assign(student, { name, phone, course, cgpa, backlogs });
      state.session.name = name;
      saveSession(state.session);
      saveDB();
      showToast('Profile saved! Eligibility across all open jobs has been updated.', 'success');
      render();
    }

    /* =========================================================================
       17. MAIN RENDER ROUTER & APPLICATION BOOTSTRAP
       ========================================================================= */
    function render() {
      const root = document.getElementById('app');
      if (!state.session) {
        root.innerHTML = renderPortalEntryView();
        return;
      }

      if (state.session.role === 'ADMIN') {
        const nav = [
          { id: 'dashboard', label: 'Dashboard', icon: '📊' },
          { id: 'students', label: 'Students', icon: '🎓' },
          { id: 'companies', label: 'Companies', icon: '🏢' },
          { id: 'jobs', label: 'Job Openings', icon: '💼' },
          { id: 'applications', label: 'Applications & Interviews', icon: '📋' },
          { id: 'reports', label: 'Reports (7)', icon: '📑' }
        ];
        let content = '';
        switch (state.activeTab) {
          case 'students': content = renderAdminStudents(); break;
          case 'companies': content = renderAdminCompanies(); break;
          case 'jobs': content = renderAdminJobs(); break;
          case 'applications': content = renderAdminApplications(); break;
          case 'reports': content = renderAdminReports(); break;
          default: content = renderAdminDashboard();
        }
        root.innerHTML = renderPortalShell(nav, content);
      } else {
        const nav = [
          { id: 'jobs', label: 'Job Openings', icon: '💼' },
          { id: 'applications', label: 'My Applications', icon: '📋' },
          { id: 'profile', label: 'My Profile', icon: '👤' }
        ];
        let content = '';
        switch (state.activeTab) {
          case 'applications': content = renderStudentApplications(); break;
          case 'profile': content = renderStudentProfile(); break;
          default: content = renderStudentJobs();
        }
        root.innerHTML = renderPortalShell(nav, content);
      }
    }

    // Bootstrap Application
    (function bootstrap() {
      initDB();
      loadSession();
      render();
    })();
  </script>
</body>
</html>
